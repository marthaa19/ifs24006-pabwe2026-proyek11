# Blueprint Render: satu service yang menyajikan API (Express + SQLite) sekaligus front-end (hasil build Vite).
# Hasilnya satu link: https://ifs24006-pabwe2026-proyek1.onrender.com
# Disk persisten (agar data SQLite tidak hilang) butuh plan berbayar (starter).
services:
  - type: web
    name: ifs24006-pabwe2026-proyek1
    runtime: node
    plan: starter
    buildCommand: cd frontend && npm install && VITE_API_URL=/api npm run build && cd ../backend && npm install
    startCommand: cd backend && npm run seed && npm start
    healthCheckPath: /api
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DB_PATH
        value: /var/data/lombaradar.db
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@lombaradar.id
      - key: ADMIN_PASSWORD
        sync: false
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
